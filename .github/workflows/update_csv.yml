name: Update CSV Daily

on:
  schedule:
    # 10:35 UTC. SIR's measurement day rolls over around 09:00-10:00 UTC (they
    # work in solar time year-round, so this does not drift with DST), which
    # means running after it is the first moment the previous day is complete.
    # An odd minute on purpose: GitHub delays cron heavily on round times --
    # the old '30 18' trigger was consistently firing at 20:38-20:57.
    - cron: '35 10 * * *'
  workflow_dispatch:     # allows manual triggering

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r update_automation/requirements.txt

      - name: Run Python scripts
        run: |
          python update_automation/update_pluvio.py
          python update_automation/update_temp.py
          python update_automation/interpolate_temp.py

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/temp_completi.csv
          git add assets/pluvio_completi.csv
          git diff --cached --quiet || git commit -m "Update CSV [automated]"
          git push
